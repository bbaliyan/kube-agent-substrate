suite: substrate-install control plane namespace
templates:
  - templates/namespace.yaml
  - templates/configmap.yaml
tests:
  - it: renders no namespace unless an ExternalSecret needs it first
    values:
      - ../ci/aws-values.yaml
    template: templates/namespace.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: gives the namespace the privileged Pod Security level, because the control plane pods run as root and mount host paths
    values:
      - ../ci/onprem-values.yaml
    set:
      storage.s3Compatible.credentials:
        secretName: ""
        externalSecret:
          enabled: true
          storeName: store
          accessKeyRemoteKey: a
          secretKeyRemoteKey: b
    template: templates/namespace.yaml
    asserts:
      - isKind:
          of: Namespace
      - equal:
          path: metadata.name
          value: ate-system
      - equal:
          path: metadata.labels["pod-security.kubernetes.io/enforce"]
          value: privileged

  - it: refuses a namespace other than ate-system, because upstream installs there only
    values:
      - ../ci/aws-values.yaml
    set:
      config.namespace: my-system
    template: templates/configmap.yaml
    asserts:
      - failedTemplate: {}
