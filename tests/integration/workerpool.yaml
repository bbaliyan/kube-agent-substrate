# The worker pool of the sample actor. It follows the counter demo of
# agent-substrate/substrate v1.0.0 (demos/counter/counter.yaml.tmpl), sized for one kind node.
apiVersion: v1
kind: Namespace
metadata:
  name: harness-workers
---
apiVersion: ate.dev/v1
kind: WorkerPool
metadata:
  name: counter
  namespace: harness-workers
  labels:
    workload: counter
spec:
  replicas: 2
  workerImage: ghcr.io/agent-substrate/substrate/ateworker-gvisor:v1.0.0
  sandboxClasses:
    - name: gvisor
  template:
    resources:
      limits:
        cpu: "1"
        memory: 1Gi
      requests:
        cpu: 250m
        memory: 1Gi
