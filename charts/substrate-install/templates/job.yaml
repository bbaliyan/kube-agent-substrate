{{- $image := include "substrate-install.image" . -}}
{{- $names := include "substrate-install.patchNames" . | fromJsonArray -}}
{{- $baseNames := include "substrate-install.basePatchNames" . | fromJsonArray -}}
{{- $patchDir := "/work/manifests/ate-install/patches" -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "substrate-install.fullname" . }}-{{ include "substrate-install.hash" . }}
  labels:
    {{- include "substrate-install.labels" . | nindent 4 }}
spec:
  backoffLimit: {{ .Values.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "substrate-install.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "substrate-install.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # Step 1: copy the checkout from the image to a writable directory. Not cp -a: the
        # account is not the owner of the volume, so it cannot set the time of the directory.
        - name: seed
          image: {{ $image }}
          command: [cp, -R, /opt/substrate/., /work/]
          securityContext:
            {{- include "substrate-install.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - {name: work, mountPath: /work}
        # Step 2: patch the copy. This must finish before the deploy starts,
        # so a sync never applies the upstream defaults.
        - name: patch
          image: {{ $image }}
          workingDir: /work/manifests/ate-install/base
          command:
            - kustomize
            - edit
            - add
            - component
            {{- range $baseNames }}
            - ../patches/{{ . }}
            {{- end }}
          securityContext:
            {{- include "substrate-install.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - {name: work, mountPath: /work}
            - {name: patches, mountPath: {{ $patchDir }}, readOnly: true}
        # Step 3: size the bundled Postgres. ate-setup applies postgres/postgres.yaml
        # on its own, outside the base kustomization, so step 2 cannot reach it. Build
        # that manifest with the patch and write it back over itself. The build fails if
        # the patch finds no StatefulSet named postgres.
        - name: patch-postgres
          image: {{ $image }}
          command:
            - kustomize
            - build
            - --load-restrictor
            - LoadRestrictionsNone
            - /work/manifests/ate-install/pg-build
            - -o
            - /work/manifests/ate-install/postgres/postgres.yaml
          securityContext:
            {{- include "substrate-install.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - {name: work, mountPath: /work}
            - {name: patches, mountPath: {{ $patchDir }}, readOnly: true}
            - {name: pg-build, mountPath: /work/manifests/ate-install/pg-build, readOnly: true}
{{- if (trim .Values.egress.trustedCaPem) }}
        # Step 4: add the private CA to the egress gateway. ate-setup reads atenet-egress.yaml on its own,
        # outside the base kustomization, so step 2 cannot reach it. Build the manifest with the patch and
        # write it back over itself. kustomize drops comments, and ate-setup needs the marker comment of the
        # credential flags, so the marker is a list item during the build. The step fails if the marker does
        # not come out once, or if the manifest no longer reads the file that the patch replaces.
        - name: patch-egress
          image: {{ $image }}
          command:
            - sh
            - -ec
            - |
              dir=/work/manifests/ate-install
              grep -q "filename: /etc/ssl/certs/ca-certificates.crt" "$dir/atenet-egress.yaml" || { echo "the egress manifest no longer reads /etc/ssl/certs/ca-certificates.crt: the CA patch has no effect" >&2; exit 1; }
              test "$(grep -c "^ *#ATE_EGRESS_INJECT_FLAGS" "$dir/atenet-egress.yaml")" = 1
              sed "s|^\( *\)#ATE_EGRESS_INJECT_FLAGS.*|\1- '#ATE_EGRESS_INJECT_FLAGS'|" "$dir/atenet-egress.yaml" > "$dir/egress-input.yaml"
              kustomize build --load-restrictor LoadRestrictionsNone "$dir/egress-build" | sed "s|^\( *\)- .#ATE_EGRESS_INJECT_FLAGS.|\1#ATE_EGRESS_INJECT_FLAGS -- Do not modify this line.|" > /tmp/egress.yaml
              test "$(grep -c "^ *#ATE_EGRESS_INJECT_FLAGS" /tmp/egress.yaml)" = 1
              cp /tmp/egress.yaml "$dir/atenet-egress.yaml"
          securityContext:
            {{- include "substrate-install.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - {name: work, mountPath: /work}
            - {name: tmp, mountPath: /tmp}
            - {name: patches, mountPath: {{ $patchDir }}, readOnly: true}
            - {name: egress-build, mountPath: /work/manifests/ate-install/egress-build, readOnly: true}
{{- end }}
      containers:
        - name: deploy
          image: {{ $image }}
          workingDir: /work
          command: [ate-setup, deploy, ate-system, --config, /config/substrate-install.yaml]
          env:
            - {name: KUBECONFIG, value: /config/kubeconfig}
            - {name: ATE_RECORD_DIR, value: /tmp/records}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- include "substrate-install.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - {name: work, mountPath: /work}
            - {name: patches, mountPath: {{ $patchDir }}, readOnly: true}
            - {name: config, mountPath: /config, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        {{- if (trim .Values.egress.trustedCaPem) }}
        - name: egress-build
          configMap:
            name: {{ include "substrate-install.fullname" . }}-{{ include "substrate-install.hash" . }}
            items:
              - {key: egress-build, path: kustomization.yaml}
        {{- end }}
        - name: pg-build
          configMap:
            name: {{ include "substrate-install.fullname" . }}-{{ include "substrate-install.hash" . }}
            items:
              - {key: pg-build, path: kustomization.yaml}
        - name: work
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: config
          configMap:
            name: {{ include "substrate-install.fullname" . }}-{{ include "substrate-install.hash" . }}
            items:
              - {key: substrate-install.yaml, path: substrate-install.yaml}
              - {key: kubeconfig, path: kubeconfig}
        - name: patches
          configMap:
            name: {{ include "substrate-install.fullname" . }}-{{ include "substrate-install.hash" . }}
            items:
              {{- range $names }}
              - {key: patch-{{ . }}, path: {{ . }}/kustomization.yaml}
              {{- end }}
