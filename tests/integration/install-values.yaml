# Test values for the substrate-install chart on kind. The image digest is set by the script.
# The test creates ate-system before the install, and Helm cannot adopt a namespace that exists.
createNamespace: false
podMonitoringCrdStub: true
storage:
  profile: s3-compatible
  bucket: snapshots
  region: us-east-1
  s3Compatible:
    endpoint: http://rustfs.ate-system.svc:9000
    pathStyle: true
    credentials:
      secretName: snapshot-store-keys
config:
  # The proxy of kubectl ate presents this identity to the router.
  ingressAllowedSPIFFEIDs: spiffe://cluster.local/ns/ate-system/sa/atenet-client
  # The actor template names its own snapshot location, which needs this preview gate.
  preview: PerTemplateSnapshotLocation
  atenet:
    egress:
      # ate-setup needs a credential provider setting. The sample actor injects no credentials.
      credentialProvider: '{"enabled":false}'
  ateapi:
    authz:
      # The registration Job creates atespaces, so its account must be a bootstrap owner.
      # The list keeps the default ate-client principal.
      bootstrapOwners: system:serviceaccount:ate-system:ate-client,system:serviceaccount:substrate-system:substrate-registration
# The bundled Postgres of the test cluster, as small as upstream's kind overlay
# (250m CPU request, 1Gi volume). The runner has 4 vCPU: with the upstream numbers
# (2 CPU request) the control plane, the database and two 1-CPU workers do not fit.
postgres:
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  storage: 1Gi
