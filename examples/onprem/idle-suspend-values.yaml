# substrate-idle-suspend values. List the same atespace and name as in the substrate-actor release.
# Needs a Prometheus that scrapes the control plane. Skip the chart on a cluster without one.
image:
  # Placeholder. Set the digest of a published registration image.
  digest: sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
actors:
  - atespace: samples
    name: sample
schedule: "*/10 * * * *"
idleMinutes: 15
suspendMode: sync
prometheus:
  url: http://prometheus.monitoring.svc:9090
