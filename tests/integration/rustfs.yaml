# RustFS as the snapshot store, with one bucket. Modelled on manifests/ate-install/kind/rustfs.yaml
# of agent-substrate/substrate v1.0.0. Differences: the keys come from the Secret
# that the harness creates, and the namespace and the Secret exist before this file is applied.
#
# RustFS 1.0.x cannot create a bucket on its own. The Job below creates it with the S3 API.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rustfs-data
  namespace: ate-system
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs
  namespace: ate-system
spec:
  selector:
    app: rustfs
  ports:
    - {name: api, port: 9000, targetPort: 9000}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
  namespace: ate-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rustfs
  template:
    metadata:
      labels:
        app: rustfs
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: rustfs
          # renovate: datasource=docker depName=rustfs/rustfs
          image: rustfs/rustfs:1.0.3@sha256:9ca9559533b537d10482fe923288b676ad08f92a7069d9a17327fbae3cab688b
          ports:
            - {name: api, containerPort: 9000}
          env:
            - {name: RUSTFS_ADDRESS, value: ":9000"}
            - {name: RUSTFS_CONSOLE_ENABLE, value: "false"}
            - {name: RUSTFS_VOLUMES, value: /data}
            - name: RUSTFS_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: snapshot-store-keys, key: access-key-id}}
            - name: RUSTFS_SECRET_KEY
              valueFrom: {secretKeyRef: {name: snapshot-store-keys, key: secret-access-key}}
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rustfs-data
---
apiVersion: batch/v1
kind: Job
metadata:
  name: rustfs-bucket-init
  namespace: ate-system
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-bucket
          # renovate: datasource=docker depName=amazon/aws-cli
          image: amazon/aws-cli:2.38.5@sha256:c8156a0e74e13929a42d7e60f0d4e14e7d28d980cd21822505d4bff80e5460c1
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: snapshot-store-keys, key: access-key-id}}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: snapshot-store-keys, key: secret-access-key}}
            - {name: AWS_REGION, value: us-east-1}
            - {name: AWS_ENDPOINT_URL, value: "http://rustfs.ate-system.svc:9000"}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              for i in $(seq 1 60); do
                aws s3api head-bucket --bucket snapshots 2>/dev/null && exit 0
                aws s3api create-bucket --bucket snapshots 2>/dev/null && exit 0
                echo "waiting for RustFS ($i/60)"
                sleep 2
              done
              exit 1
---
# The control plane denies ingress to every pod of its namespace by default.
# The snapshot plugins of ate-api-server and atelet and the bucket Job reach the S3 API.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rustfs
  namespace: ate-system
spec:
  podSelector:
    matchLabels:
      app: rustfs
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - {key: app, operator: In, values: [ate-api-server, atelet]}
        - podSelector:
            matchLabels:
              batch.kubernetes.io/job-name: rustfs-bucket-init
        - podSelector:
            matchLabels:
              batch.kubernetes.io/job-name: snapshot-list
      ports:
        - {protocol: TCP, port: api}
