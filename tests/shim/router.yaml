# A stand-in for the ingress router of the control plane. It needs a client
# certificate, as the router does, and answers 200 with the two headers that
# the shim sets. The test in run.sh sends the shim here.
static_resources:
  listeners:
    - name: router
      address:
        socket_address: {address: 0.0.0.0, port_value: 443}
      filter_chains:
        - transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              require_client_certificate: true
              common_tls_context:
                tls_certificates:
                  - certificate_chain: {filename: /certs/server.pem}
                    private_key: {filename: /certs/server.key}
                validation_context:
                  trusted_ca: {filename: /certs/ca.pem}
          filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: router
                route_config:
                  virtual_hosts:
                    - name: all
                      domains: ["*"]
                      routes:
                        - match: {prefix: /}
                          direct_response: {status: 404}
                http_filters:
                  - name: envoy.filters.http.lua
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                      default_source_code:
                        inline_string: |
                          function envoy_on_request(h)
                            local headers = h:headers()
                            h:respond({[":status"] = "200"},
                              "actor=" .. (headers:get("ate-target-actor") or "") ..
                              " token=" .. (headers:get("x-gitlab-token") or "") .. "\n")
                          end
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
