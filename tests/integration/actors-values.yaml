# One sample actor. Both the substrate-actor and the substrate-registration release use this file.
# The script sets actors[0].image to the counter image that it pushed.
snapshotStorageLocation: s3://snapshots/actors
actors:
  - name: counter
    atespace: harness
    # Fill 256 MiB of the sandbox before the server starts, so the snapshot is large and
    # holds data that does not compress. Substrate uploads such a snapshot in parallel parts.
    command: [sh, -c, "head -c 268435456 /dev/urandom > /fill && exec /counter"]
    workerSelector:
      workload: counter
    resources:
      cpuMillicores: 1000
      memoryBytes: 536870912
    wakeupProbe:
      path: /readyz
      port: 80
    egress:
      - protocol: https
        hostnames: [example.com]
      - protocol: tlsPassthrough
        hostnames: ["*.example.org"]
        ports: [443]
