{{- range $actor := .Values.actors }}
{{- with $actor.webhook }}
{{- $webhook := . }}
{{- $ctx := dict "root" $ "actor" $actor }}
{{- $name := printf "%s-webhook" $actor.name }}
{{- $port := $webhook.port | default 8080 }}
{{- $config := dict "envoy.yaml" (include "substrate-actor.shimEnvoy" $ctx) "sds-client.yaml" (include "substrate-actor.shimSdsClient" $ctx) "sds-ca.yaml" (include "substrate-actor.shimSdsCa" $ctx) }}
{{- with .secret.externalSecret }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $webhook.secret.name }}
  labels:
    {{- include "substrate-actor.labels" $ctx | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .storeName }}
    kind: {{ .storeKind | default "ClusterSecretStore" }}
  target:
    name: {{ $webhook.secret.name }}
  data:
    {{- range .data }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ .remoteKey }}
    {{- end }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "substrate-actor.labels" $ctx | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels:
    {{- include "substrate-actor.labels" $ctx | nindent 4 }}
data:
  {{- range $file, $content := $config }}
  {{ $file }}: |
    {{- $content | nindent 4 }}
  {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "substrate-actor.labels" $ctx | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "substrate-actor.selector" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "substrate-actor.selector" $ctx | nindent 8 }}
      annotations:
        checksum/config: {{ toJson $config | sha256sum }}
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: false
      containers:
        - name: envoy
          image: {{ $.Values.webhookShimImage }}
          args: ["-c", "/etc/envoy/envoy.yaml", "--disable-hot-restart"]
          ports:
            - name: http
              containerPort: {{ $port }}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
          {{- with $webhook.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- else }}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - {name: config, mountPath: /etc/envoy, readOnly: true}
            - {name: secret, mountPath: /secrets, readOnly: true}
            - {name: router-client, mountPath: /run/router-client, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap:
            name: {{ $name }}
        - name: secret
          secret:
            secretName: {{ $webhook.secret.name }}
            items:
              - key: {{ $webhook.secret.key | default "WEBHOOK_SECRET" }}
                path: WEBHOOK_SECRET
        - name: router-client
          projected:
            sources:
              - podCertificate:
                  signerName: podidentity.podcert.ate.dev/identity
                  keyType: ECDSAP256
                  credentialBundlePath: credential-bundle.pem
              - clusterTrustBundle:
                  signerName: servicedns.podcert.ate.dev/identity
                  labelSelector:
                    matchLabels:
                      podcert.ate.dev/canarying: live
                  path: router-ca.pem
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "substrate-actor.labels" $ctx | nindent 4 }}
spec:
  selector:
    {{- include "substrate-actor.selector" $ctx | nindent 4 }}
  ports:
    - name: http
      port: {{ $port }}
      targetPort: http
{{- with .allowFrom }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "substrate-actor.labels" $ctx | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "substrate-actor.selector" $ctx | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - port: {{ $port }}
          protocol: TCP
{{- end }}
{{- with .ingress }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  labels:
    {{- include "substrate-actor.labels" $ctx | nindent 4 }}
  {{- with .annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .tlsSecretName }}
  tls:
    - hosts:
        - {{ .host }}
      secretName: {{ .tlsSecretName }}
  {{- end }}
  rules:
    - host: {{ .host }}
      http:
        paths:
          - path: {{ .path | default "/" }}
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}
                port:
                  name: http
{{- end }}
{{- end }}
{{- end }}
