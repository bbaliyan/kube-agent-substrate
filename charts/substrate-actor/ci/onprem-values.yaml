# On-prem profile, one actor. Placeholder PR-review example: copy it and set your own values.
snapshotStorageLocation: objectstore://snapshots
actors:
  - name: pr-review
    atespace: reviews
    image: registry.example.com/agents/pr-review@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    args: ["--port=8080"]
    env:
      LOG_LEVEL: info
    workerSelector:
      workload: pr-review
    resources:
      cpuMillicores: 2000
      memoryBytes: 4294967296
    wakeupProbe:
      path: /healthz
      port: 8080
    egressTrustBundle: true
    egress:
      - protocol: https
        hostnames: [git.example.com]
        credential:
          header: Authorization
          prefix: "Bearer "
          credentialUri: ate-secret://secrets/reviews/git-token
      - protocol: tlsPassthrough
        hostnames: ["*.llm.example.com"]
        ports: [443]
