# One entry in `actors` defines one actor: its template, its egress policy and an
# optional webhook shim with an ingress. See ci/ for complete examples.

# Where the control plane stores snapshots. The bucket name is a consumer input.
snapshotStorageLocation: objectstore://substrate-snapshots

# The webhook shim of an actor with a `webhook` block runs this Envoy image.
# renovate: datasource=docker depName=docker.io/envoyproxy/envoy
webhookShimImage: docker.io/envoyproxy/envoy:v1.34.12@sha256:bd505f0362a5b0d575b09858fdf884f0860a1971df052ad99df0959fb1396e8d

# The ingress router of the control plane. The shim sends every accepted request here over mTLS.
router:
  host: atenet-router.ate-system.svc
  port: 443

actors: []
