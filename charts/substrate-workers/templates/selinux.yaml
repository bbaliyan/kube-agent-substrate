{{- if .Values.selinux.enabled }}
{{- $name := printf "%s-worker-selinux" (include "substrate-workers.poolName" .) }}
# Worker pods are generated by the control plane, and the WorkerPool has no securityContext field,
# so only admission can set the SELinux type. Needs Kubernetes 1.36 or later: MutatingAdmissionPolicy is GA there.
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: {{ $name }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    {{- include "substrate-workers.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  reinvocationPolicy: IfNeeded
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ .Release.Namespace }}
    objectSelector:
      matchLabels:
        ate.dev/worker-pool: {{ include "substrate-workers.poolName" . }}
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  mutations:
    # A merge, so it works whether or not the pod already has a securityContext.
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{spec: Object.spec{securityContext: Object.spec.securityContext{
          seLinuxOptions: Object.spec.securityContext.seLinuxOptions{type: "spc_t"}}}}
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: {{ $name }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    {{- include "substrate-workers.labels" . | nindent 4 }}
spec:
  policyName: {{ $name }}
{{- end }}
