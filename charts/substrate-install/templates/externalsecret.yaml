{{- if eq .Values.storage.profile "s3-compatible" }}
{{- with .Values.storage.s3Compatible.credentials.externalSecret }}
{{- if .enabled }}
{{- $creds := $.Values.storage.s3Compatible.credentials }}
# The Secret lives in the control plane namespace, where the containers read it.
# That namespace must exist before this resource syncs.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "substrate-install.s3SecretName" $ }}
  namespace: {{ $.Values.config.namespace }}
  labels:
    {{- include "substrate-install.labels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: {{ .refreshInterval }}
  secretStoreRef:
    name: {{ required "externalSecret.storeName is required" .storeName }}
    kind: {{ .storeKind }}
  target:
    name: {{ include "substrate-install.s3SecretName" $ }}
  data:
    - secretKey: {{ $creds.accessKeyKey }}
      remoteRef:
        key: {{ required "externalSecret.accessKeyRemoteKey is required" .accessKeyRemoteKey }}
    - secretKey: {{ $creds.secretKeyKey }}
      remoteRef:
        key: {{ required "externalSecret.secretKeyRemoteKey is required" .secretKeyRemoteKey }}
{{- end }}
{{- end }}
{{- end }}
