# AWS profile, three actors. Placeholder PR-review example: copy it and set your own values.
snapshotStorageLocation: objectstore://example-snapshots
actors:
  - name: pr-review
    atespace: reviews
    image: registry.example.com/agents/pr-review@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    args: ["--port=8080"]
    env:
      LOG_LEVEL: info
    workerSelector:
      workload: pr-review
    resources:
      cpuMillicores: 2000
      memoryBytes: 4294967296
    wakeupProbe:
      path: /healthz
      port: 8080
    egress:
      - protocol: https
        hostnames: [git.example.com]
        credential:
          header: Authorization
          prefix: "Bearer "
          credentialUri: ate-secret://secrets/reviews/git-token
      - protocol: tlsPassthrough
        hostnames: ["*.llm.example.com"]
        ports: [443]
    webhook:
      image: registry.example.com/agents/webhook-shim@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
      port: 8080
      env:
        TARGET_ATESPACE: reviews
      secret:
        name: pr-review-webhook
        externalSecret:
          storeName: aws-secrets
          storeKind: ClusterSecretStore
          data:
            - secretKey: WEBHOOK_SECRET
              remoteKey: /example/pr-review/webhook-secret
      ingress:
        className: alb
        host: pr-review.example.com
        tlsSecretName: pr-review-tls
  - name: docs-writer
    atespace: writing
    image: registry.example.com/agents/docs-writer@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    resources:
      cpuMillicores: 1000
      memoryBytes: 2147483648
    command: ["/usr/local/bin/docs-writer"]
  - name: triage
    atespace: reviews
    image: registry.example.com/agents/triage@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
    resources:
      cpuMillicores: 1000
      memoryBytes: 2147483648
    egress:
      - protocol: http
        hostnames: [tracker.example.com]
        ports: [80]
