suite: substrate-actor
templates:
  - templates/actor.yaml
tests:
  - it: renders nothing without actors
    set:
      actors: []
    asserts:
      - hasDocuments:
          count: 0
        template: templates/actor.yaml

  - it: defines an actor from values only
    values:
      - ../ci/onprem-values.yaml
    template: templates/actor.yaml
    documentSelector:
      path: metadata.name
      value: pr-review-actor
    asserts:
      - isKind:
          of: ConfigMap
      - matchRegex:
          path: data["template.yaml"]
          pattern: "image: registry.example.com/agents/pr-review@sha256:"
      - matchRegex:
          path: data["egress-policy.yaml"]
          pattern: "credentialUri: ate-secret://secrets/reviews/git-token"

  - it: mounts the trust bundle of the egress gateway when egressTrustBundle is true
    values:
      - ../ci/onprem-values.yaml
    template: templates/actor.yaml
    documentSelector:
      path: metadata.name
      value: pr-review-actor
    asserts:
      - matchRegex:
          path: data["template.yaml"]
          pattern: "mountPath: /run/ate/egress-trust-bundle"
      - matchRegex:
          path: data["template.yaml"]
          pattern: "egress-mitm.ate.dev"
      - matchRegex:
          path: data["template.yaml"]
          pattern: "system-roots.ate.dev"
      - matchRegex:
          path: data["template.yaml"]
          pattern: "path: trust-bundle.pem"

  - it: mounts no trust bundle by default
    set:
      actors:
        - name: pr-review
          atespace: reviews
          image: registry.example.com/agents/pr-review@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          resources: {cpuMillicores: 1000, memoryBytes: 1073741824}
    template: templates/actor.yaml
    asserts:
      - notMatchRegex:
          path: data["template.yaml"]
          pattern: "trust-bundle|systemInfo"

  - it: renders one config map per actor
    values:
      - ../ci/aws-multi-values.yaml
    template: templates/actor.yaml
    asserts:
      - hasDocuments:
          count: 3

  - it: omits the egress policy when an actor has no egress rules
    values:
      - ../ci/aws-multi-values.yaml
    template: templates/actor.yaml
    documentSelector:
      path: metadata.name
      value: docs-writer-actor
    asserts:
      - notExists:
          path: data["egress-policy.yaml"]



  - it: accepts a tag together with a digest
    set:
      actors:
        - name: probe
          atespace: probes
          image: registry.example.com/agents/probe:1.2@sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
          resources: {cpuMillicores: 1000, memoryBytes: 1073741824}
    asserts:
      - hasDocuments:
          count: 1
        template: templates/actor.yaml

  - it: accepts a reference with no registry
    set:
      actors:
        - name: probe
          atespace: probes
          image: probe@sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
          resources: {cpuMillicores: 1000, memoryBytes: 1073741824}
    asserts:
      - hasDocuments:
          count: 1
        template: templates/actor.yaml

  - it: rejects an image without a digest
    set:
      actors:
        - name: probe
          atespace: probes
          image: registry.example.com/agents/probe
          resources: {cpuMillicores: 1000, memoryBytes: 1073741824}
    asserts:
      - failedTemplate:
          errorPattern: "does not match pattern"

  - it: rejects an image with a tag and no digest
    set:
      actors:
        - name: probe
          atespace: probes
          image: registry.example.com/agents/probe:1.2
          resources: {cpuMillicores: 1000, memoryBytes: 1073741824}
    asserts:
      - failedTemplate:
          errorPattern: "does not match pattern"

  - it: rejects an actor without a memory limit
    set:
      actors:
        - name: probe
          atespace: probes
          image: registry.example.com/agents/probe@sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
          resources: {cpuMillicores: 1000}
    asserts:
      - failedTemplate:
          errorPattern: "memoryBytes"

  - it: rejects an actor without a cpu limit
    set:
      actors:
        - name: probe
          atespace: probes
          image: registry.example.com/agents/probe@sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
          resources: {memoryBytes: 1073741824}
    asserts:
      - failedTemplate:
          errorPattern: "cpuMillicores"

  - it: names the template after a hash of its inputs and publishes that name for registration
    values:
      - ../ci/onprem-values.yaml
    template: templates/actor.yaml
    documentSelector:
      path: metadata.name
      value: pr-review-actor
    asserts:
      - matchRegex:
          path: data["template-name"]
          pattern: "^pr-review-[a-f0-9]{10}$"
      - matchRegex:
          path: data["template.yaml"]
          pattern: "(?m)^  name: pr-review-[a-f0-9]{10}$"

  - it: keeps the template name for the same inputs
    template: templates/actor.yaml
    set:
      snapshotStorageLocation: objectstore://example-snapshots
      actors:
        - name: pr-review
          atespace: reviews
          image: registry.example.com/agents/pr-review@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          env:
            LOG_LEVEL: info
          resources:
            cpuMillicores: 2000
            memoryBytes: 4294967296
    asserts:
      - equal:
          path: data["template-name"]
          value: pr-review-a175edb34e

  - it: gives the template a new name when an input of the template changes
    template: templates/actor.yaml
    set:
      snapshotStorageLocation: objectstore://example-snapshots
      actors:
        - name: pr-review
          atespace: reviews
          image: registry.example.com/agents/pr-review@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          env:
            LOG_LEVEL: debug
          resources:
            cpuMillicores: 2000
            memoryBytes: 4294967296
    asserts:
      - equal:
          path: data["template-name"]
          value: pr-review-453ef36640

  - it: keeps the template name when only the egress rules change
    template: templates/actor.yaml
    set:
      snapshotStorageLocation: objectstore://example-snapshots
      actors:
        - name: pr-review
          atespace: reviews
          image: registry.example.com/agents/pr-review@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          env:
            LOG_LEVEL: info
          resources:
            cpuMillicores: 2000
            memoryBytes: 4294967296
          egress:
            - protocol: https
              hostnames: [git.example.com]
    asserts:
      - equal:
          path: data["template-name"]
          value: pr-review-a175edb34e
      - notEqual:
          path: data["egress-hash"]
          value: 4f53cda18c
      - matchRegex:
          path: data["egress-policy.json"]
          pattern: '"rules":\[\{"https":\{"hostnames":\["git.example.com"\],"ports":\{"numbers":\[443\]\}\}\}\]'

  - it: renders the ports that the server fills in, so the registration Job finds no difference
    template: templates/actor.yaml
    set:
      snapshotStorageLocation: objectstore://example-snapshots
      actors:
        - name: pr-review
          atespace: reviews
          image: registry.example.com/agents/pr-review@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          resources:
            cpuMillicores: 2000
            memoryBytes: 4294967296
          egress:
            - protocol: http
              hostnames: [plain.example.com]
            - protocol: https
              hostnames: [git.example.com]
              ports: [8443]
            - protocol: tlsPassthrough
              hostnames: [raw.example.com]
              ports: [443]
    asserts:
      - matchRegex:
          path: data["egress-policy.json"]
          pattern: '"rules":\[\{"http":\{"hostnames":\["plain.example.com"\],"ports":\{"numbers":\[80\]\}\}\},\{"https":\{"hostnames":\["git.example.com"\],"ports":\{"numbers":\[8443\]\}\}\},\{"tlsPassthrough":\{"hostnames":\["raw.example.com"\],"ports":\{"numbers":\[443\]\}\}\}\]'

  - it: rejects a webhook block, because the chart runs no shim
    template: templates/actor.yaml
    set:
      actors:
        - name: pr-review
          atespace: reviews
          image: registry.example.com/agents/pr-review@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          resources: {cpuMillicores: 1000, memoryBytes: 1073741824}
          webhook:
            port: 8080
    asserts:
      - failedTemplate:
          errorPattern: "webhook"
