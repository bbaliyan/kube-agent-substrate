# Setup only. Every check lives in the Makefile; pipeline-lint in
# make test-commit fails this file if it ever runs one.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  commit:
    runs-on: ubuntu-latest
    container: ghcr.io/bbaliyan/kube-devenv:0.17.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: make test-commit BASE_REF=${{ github.event.pull_request.base.sha || github.event.before }}

  # Builds the install image and runs the patch steps on it. Nothing is pushed.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make test-image
      - run: make image PLATFORM=linux/arm64 IMAGE=substrate-install:arm64
      - run: make test-image-registration
      - run: make image-registration PLATFORM=linux/arm64 REGISTRATION_IMAGE=substrate-registration:arm64

  # Installs Substrate on a kind cluster, registers a sample actor and checks that it suspends
  # and resumes (make test-integration). It is a separate job so the other checks stay fast.
  # It is not a required check yet: it pulls images from public registries and runs on a small
  # runner, so wait for a record of green runs before the branch rules depend on it.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The runner has about 14 GB free. The images and the kind node need more, so remove tools that the test does not use.
      - run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - run: make test-integration

  # Pushes the multi-arch image on main only. It tags main-<short sha>, never a release tag.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [commit, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: make publish IMAGE=ghcr.io/bbaliyan/kube-agent-substrate/substrate-install:main-${GITHUB_SHA::7} | tee -a "$GITHUB_STEP_SUMMARY"
      - run: make publish-registration REGISTRATION_IMAGE=ghcr.io/bbaliyan/kube-agent-substrate/substrate-registration:main-${GITHUB_SHA::7} | tee -a "$GITHUB_STEP_SUMMARY"
